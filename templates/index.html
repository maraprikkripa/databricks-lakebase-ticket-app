<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Support Tickets</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Support Tickets</h1>

    <table>
        <thead>
            <tr><th>Title</th><th>Status</th><th>Created By</th><th>Created At</th></tr>
        </thead>
        <tbody>
            {% for t in tickets %}
            <tr>
                <td><a href="/tickets/{{ t.ticket_id }}">{{ t.title }}</a></td>
                <td>
                    <span class="status">
                        <span class="dot dot-{{ t.status }}"></span>{{ t.status }}
                    </span>
                </td>
                <td>{{ t.created_by }}</td>
                <td>{{ t.created_at }}</td>
            </tr>
            {% else %}
            <tr><td colspan="4">No tickets yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="card">
        <h3>Create a new ticket</h3>
        <form method="post" action="/tickets">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Short summary" required>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" placeholder="Describe the issue..."></textarea>

            <label for="email">Your email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <button type="submit">Create ticket</button>
        </form>
    </div>
</body>
</html>
