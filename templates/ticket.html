<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ ticket.title }}</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; color: #222; }
        a.back { color: #2563eb; text-decoration: none; }
        .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.85em; }
        .status-open { background: #ffe9b3; }
        .status-in_progress { background: #b3d9ff; }
        .status-resolved { background: #c6f0c2; }
        .message { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin: 10px 0; }
        .message .meta { color: #666; font-size: 0.85em; margin-bottom: 4px; }
        form { margin-top: 20px; padding: 16px; border: 1px solid #ddd; border-radius: 6px; }
        textarea { width: 100%; padding: 6px; box-sizing: border-box; }
        select, button { padding: 6px 10px; margin-top: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <a class="back" href="/">&larr; All tickets</a>
    <h1>{{ ticket.title }}</h1>
    <p>
        Status: <span class="status status-{{ ticket.status }}">{{ ticket.status }}</span>
        &nbsp;|&nbsp; Created by {{ ticket.created_by }} on {{ ticket.created_at }}
    </p>

    <form method="post" action="/tickets/{{ ticket.ticket_id }}/status">
        <label for="status">Update status:</label>
        <select name="status" id="status">
            {% for s in statuses %}
            <option value="{{ s }}" {% if s == ticket.status %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
        <button type="submit">Update</button>
    </form>

    <h3>Messages</h3>
    {% for m in messages %}
    <div class="message">
        <div class="meta">{{ m.author }} &middot; {{ m.created_at }}</div>
        <div>{{ m.message_text }}</div>
    </div>
    {% else %}
    <p>No messages yet.</p>
    {% endfor %}

    <form method="post" action="/tickets/{{ ticket.ticket_id }}/messages">
        <h3>Add a message</h3>
        <textarea name="message_text" rows="3" placeholder="Type your message..." required></textarea>
        <br>
        <button type="submit">Add message</button>
    </form>
</body>
</html>
